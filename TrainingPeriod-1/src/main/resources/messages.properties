##############################
# 共通エラーメッセージ
validate.notblank={0}を入力してください。

id=ID
pass=パスワード
pass_re=パスワード再入力
name=名前
kana=カナ
birth=生年月日
club=委員会

#login半角英数字の入力チェックエラーメッセージ
validate.hwAlphanumeric = {0}は半角英数字で入力してください。

validate.idCorrect = ユーザーIDが間違っています。

validate.name = {0}は全角で入力してください。

validate.katakana = カナは半角カナで入力してください。

validate.notEqual = パスワードが間違っています。

#search入力チェックメッセージ
validate.allBlank = どれかひとつの項目は入力してください。

#register/update form 入力チェックメッセージ
blank.input = {0}を入力してください。

validate.idFormat = IDは半角英数字5文字で入力してください。

validate.userExisted = このユーザーIDは既に使用されています。 

validate.registerNotEqual = パスワードが一致しません。

validate.pass = パスワードは半角英数字8文字以内で入力してください。

pass.reInput = パスワードを再入力してください。

validate.fullWidth = {0}は全角文字40文字以内で入力してください。

validate.date = 生年月日の形式が正しくありません。

validate.registerKana = カナは半角カタカナ40文字以内で入力してください。

#成功メッセージ
id.available = IDが使用可能です。

register.success = データを登録しました。

update.success = データを更新しました。

delete.success = データを削除しました。

#失敗メッセージ
login.failure=ログインに失敗しました。ログイン情報を再度確認してください。

server.failure=申し訳ございませんが、システムエラーが発生しました。しばらく経ってから再度お試しください。

save.failure=保存に失敗しました。ファイルのバージョンを再確認してください.

register.failure = データの登録に失敗しました。

search.failure = 検索結果がありません。

update.failure = データの更新に失敗しました。

delete.failure = データの削除に失敗しました。

system.failure = システムエラーが発生しました。
