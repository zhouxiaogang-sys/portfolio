<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編集記録</title>
    <link href="/css/history/history.css" rel="stylesheet">
    <link href="/css/history/diff.css" rel="stylesheet">

</head>
<body>
    <div class="container">
        <!-- 左側 -->
        <div class="history-card">
            <h2 class="card-title">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                バージョン履歴
            </h2>
            <div class="history-list" id="historyList">
            </div>
        </div>

        <!-- 右側のコンテンツ表示 -->
        <div class="content-card">
            <h2 class="card-title">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                ファイルコンテンツ
            </h2>
            <div class="content-viewer">
                <div class="version-control">
                    <div class="select-group">
                        <select id="oldVersion" class="version-select">
                            <option value="">旧バージョンを選択</option>
                        </select>
                        <select id="newVersion" class="version-select">
                            <option value="">新バージョンを選択</option>
                        </select>
                        <button id="compareButton" class="compare-button">比較</button>
                    </div>
                </div>
                <div id="normalView">
                    <div class="content-header" id="contentHeader">
                        バージョンを選択してください
                    </div>
                    <div class="content-body" id="contentBody"></div>
                </div>
                <div id="diffView" style="display:none;">
                    <div class="diff-header">バージョン比較</div>
                    <div class="diff-content" id="diffContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // 初期データの設定
        window.APP_DATA = {
            initialHistory: /*[[${history}]]*/ [],
            currentFileId: /*[[${fileId}]]*/ ''
        };
    </script>

    <script src="/js/history/utils.js" defer></script>
    <script src="/js/history/diff.js" defer></script>
    <script src="/js/history/main.js" defer></script>

</body>
</html>
