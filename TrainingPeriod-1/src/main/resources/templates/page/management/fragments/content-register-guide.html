<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:fragment="content-register-guide">
    <div class="content-header">
        <h1>手順書登録</h1>
    </div>

    <div class="register-content">
            <div class="form-row">
                <div class="form-group">
                    <label for="registerFileId">ファイルID：</label>
                    <input type="text" id="registerFileId" name="file-id"><br>
                    <span id="registerFileId--error" class="error"></span>
                    <span id="backFileId--error" class="error" th:if="${errorMessage != null}"></span>

                </div>

                <div class="form-group">
                    <label for="registerFileName">ファイル名：</label>
                    <input type="text" id="registerFileName" name="filename"><br>
                    <span id="registerFileName--error" class="error"></span>
                    <span id="backFileName--error" class="error" th:if="${errorMessage != null}"></span>

                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="registerTask">所属課題：</label>
                    <select id="registerTask" name="task">
                        <option value="">選択してください</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="SpringBoot">SpringBoot</option>
                    </select><br>
                    <span id="registerTask--error" class="error"></span>
                    <span id="backTask--error" class="error" th:if="${errorMessage != null}"></span>

                </div>

                <div class="form-group">
                    <label for="registerSortOrder">順番：</label>
                    <input type="text" id="registerSortOrder" name="sort-order"><br>
                    <span id="registerSortOrder--error" class="error"></span>
                    <span id="backSortOrder--error" class="error" th:if="${errorMessage != null}"></span>

                </div>
            </div>

            <div class="form-group">
                <label for="registerAuthor">作成者：</label>
                <input type="text" id="registerAuthor" name="author"><br>
                <span id="registerAuthor--error" class="error"></span>
                <span id="backAuthor--error" class="error" th:if="${errorMessage != null}"></span>

            </div>

            <div class="errorMessage" id="errorMessage" th:if="${errorMessage != null}">
                <span th:text="${errorMessage}"></span>
            </div>
            <br><br>

            <div class="button-group">
                <button class="register-btn">登録</button>
            </div>
<!--        </form>-->
    </div>
</div>
</body>
</html>
