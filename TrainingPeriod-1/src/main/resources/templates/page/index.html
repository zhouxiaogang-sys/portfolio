<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>研修用ページ</title>
    <link rel="stylesheet" th:href="@{/css/index/index.css}">
</head>
<body>
<div class="container">
    <h1 class="title">研修用ページ</h1>

    <div class="features-grid">
        <!-- 手順書一覧 -->
        <a th:href="@{/guide-books}" class="feature-card task-B">
            <div class="feature-header">
                <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                </svg>
                <div class="feature-title">手順書一覧</div>
            </div>
            <p class="feature-description">
                課題手順書の一覧を表示し、必要な手順書を素早く見つけることができます。
            </p>
        </a>

        <!-- 課題一覧 -->
        <a th:href="@{/tasks}" class="feature-card task-A">
            <div class="feature-header">
                <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                </svg>
                <div class="feature-title">課題一覧</div>
            </div>
            <p class="feature-description">
                すべての課題を確認し、進捗状況を把握できます。
            </p>
        </a>

        <!-- 管理者ページ -->
        <a onclick="showLogin()" class="feature-card task-C">
            <div class="feature-header">
                <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <div class="feature-title">管理者ページ</div>
            </div>
            <p class="feature-description">
                課題や手順書の追加、編集、削除も可能です。
            </p>
        </a>
    </div>

    <!--　ログイン処理 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="form-group">
                <label for="username">管理者ID：</label>
                <input type="text" id="username" name="username">
            </div>
            <br>

            <div class="form-group">
                <label for="password">パスワード：</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="errorMessage" id="errorMessage" th:if="${errorMessage != null}">
                <span th:text="${errorMessage}"></span>
            </div>

            <div class="button-group">
                <button id="cancel-btn" onclick="closeLogin()" type="button">キャンセル</button>
                <button id="login-btn">ログイン</button>
            </div>

        </div>
    </div>
</div>

<script src="/js/index/modal.js"></script>
<script th:inline="javascript">
    window.APP_DATA = {
        sessionUsername: /*[[${session.username}]]*/ null
    };
</script>

</body>
</html>
